# The wall's front door, replacing ftindex.
#
#   sudo cp deploy/nginx-betelgeuse.conf /etc/nginx/sites-available/betelgeuse
#   sudo ln -sf ../sites-available/betelgeuse /etc/nginx/sites-enabled/betelgeuse
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo systemctl disable --now ftindex.service
#
# ftindex was 14 kB of Python doing four things nginx does in a page of config:
# proxy the panel at the root, serve the preview images off disk, hold one
# static page of its own, and say something useful when the scheduler is down.
# The reason it existed as a separate process was that pushing a couple of
# megabytes of previews through ftsched would have run them through the GIL the
# render loop is waiting on -- and that argument disappears entirely when the
# process is nginx, which is also simply better at the static bytes that make up
# most of the traffic.
#
# One origin on one port is the point. It is what lets `tailscale serve` put a
# real certificate in front of all of it without any page having to know which
# of its links need a different scheme:
#
#   tailscale serve --bg --https=443 http://127.0.0.1:80
#
# Nothing here is authenticated, deliberately and as before: it is a wall in a
# workshop, and anything on the network can already push pixels at it over UDP.
# Keep it on the LAN or the tailnet. Do not put it on the internet.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Someone standing in front of the wall with a phone types the hostname and
    # nothing else, so the panel owns the root.
    root /home/pi/ft-cpp/deploy/www;

    access_log off;             # a phone polling once a second, times the room
    error_log /var/log/nginx/betelgeuse-error.log;

    # The previews are the overwhelming majority of the bytes: a cold panel load
    # is three dozen files. Straight off disk, and cacheable -- one only changes
    # when its demo does, and then the daemon has been restarted anyway.
    location /previews/ {
        alias /home/pi/ft-cpp/demos/previews/;
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
    }

    location = /about {
        try_files /about.html =404;
    }

    # Display-wide state: on/off, brightness, wipe. ftctl, not ftsched -- which
    # is the whole point of it being a separate daemon. This has to keep working
    # when the scheduler is stopped, so it must not share the panel's upstream
    # or its error page.
    location /api/display {
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
    }

    location = /api/thumbnail.png {
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
    }

    # Everything else is the scheduler's control panel.
    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 2s;
        proxy_read_timeout 15s;

        # "Connection refused" on the one URL anybody knows is a much worse
        # answer than a page saying which of the two halves is broken.
        # Without the '=' the original status is kept, so this stays a 502
        # rather than becoming a 200 that happens to contain bad news.
        proxy_intercept_errors on;
        error_page 502 503 504 /down.html;
    }

    location = /down.html {
        internal;               # reachable as an error page, not by URL
    }
}
